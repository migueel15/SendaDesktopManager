# Generado por Senda a partir del tema "{{.Name}}". Se sobrescribe al cambiar de tema.
# Esquema de color para qt5ct y qt6ct. En qt5ct.conf o qt6ct.conf, sección [Appearance]:
#   custom_palette=true
#   color_scheme_path=/RUTA/A/.config/senda/generated/qt/senda.conf
# Orden de QPalette: WindowText, Button, Light, Midlight, Dark, Mid, Text, BrightText,
# ButtonText, Base, Window, Shadow, Highlight, HighlightedText, Link, LinkVisited,
# AlternateBase, NoRole, ToolTipBase, ToolTipText, PlaceholderText.

