# Generado por Senda a partir del tema "{{.Name}}". Se sobrescribe al cambiar de tema.
# Uso: añade `source = ~/.config/senda/generated/hyprland/colors.conf` al final de hyprland.conf.
# Las variables $senda_* se pueden usar en tu propia configuración.
{{range $key, $value := .C}}
$senda_{{$key}} = rgb({{bare $value}}){{end}}

general {
    col.active_border = rgb({{bare .C.primary}}) rgb({{bare .C.accent}}) 45deg
    col.inactive_border = rgb({{bare .C.border}})
}

group {
    col.border_active = rgb({{bare .C.primary}})
    col.border_inactive = rgb({{bare .C.border}})

    groupbar {
        col.active = rgb({{bare .C.primary}})
        col.inactive = rgb({{bare .C.surfaceVariant}})
        text_color = rgb({{bare .C.text}})
    }
}

misc {
    background_color = rgb({{bare .C.base}})
}
