name: Release

on:
  push:
    tags:
      - "v*"

permissions: {}

jobs:
  release:
    name: Build and publish release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: core/go.mod

      - name: Package release assets
        env:
          TAG: ${{ github.ref_name }}
          SENDA_GOOGLE_CLIENT_ID: ${{ secrets.SENDA_GOOGLE_CLIENT_ID }}
          SENDA_GOOGLE_CLIENT_SECRET: ${{ secrets.SENDA_GOOGLE_CLIENT_SECRET }}
        run: |
          core/scripts/package-release.sh "$TAG" "$RUNNER_TEMP/release"

      - name: Write update manifest
        env:
          TAG: ${{ github.ref_name }}
        run: |
          core/scripts/release-manifest.sh "$TAG" \
            "https://github.com/migueel15/SendaDesktopManager/releases/latest/download/latest.json" \
            "$RUNNER_TEMP/release/latest.json"

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          cd "$GITHUB_WORKSPACE"
          assets="$RUNNER_TEMP/release"
          gh release create "$TAG" \
            "$assets/senda-$TAG-linux-amd64" \
            "$assets/senda-quickshell-$TAG.tar.gz" \
            "$assets/checksums.txt" \
            "$assets/latest.json" \
            --title "$TAG" \
            --generate-notes
